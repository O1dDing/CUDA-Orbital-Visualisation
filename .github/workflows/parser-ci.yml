name: core-ci

on:
  push:
  pull_request:

jobs:
  cpu-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU core build
        run: cmake -S . -B build -DCOV_ENABLE_CUDA=OFF -DCOV_BUILD_TESTS=ON
      - name: Build parser, orbital chemistry, diagram and UI targets
        run: cmake --build build --config Release --parallel
      - name: Download pinned real Gaussian 16 FCHK regression
        run: >-
          python -c "import urllib.request; u='https://raw.githubusercontent.com/cclib/cclib/21daa960123d28aa21eeaaacc2a1dea39e136829/data/FChk/basicGaussian16/dvb_sp.fchk'; urllib.request.urlretrieve(u, r'build/real_gaussian16_dvb_sp.fchk')"
      - name: Run test suite
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload deterministic MO visual-regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mo-visual-${{ matrix.os }}
          path: build/visual_artifacts/
          if-no-files-found: warn

  windows-cuda-viewer:
    name: Windows CUDA viewer
    needs: cpu-core
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA 12.8.2 build toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.2'
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump", "visual_studio_integration"]'
      - name: Configure Blackwell Release viewer
        shell: pwsh
        run: >-
          cmake -S . -B build-cuda
          -G "Visual Studio 17 2022" -A x64
          -DCOV_ENABLE_CUDA=ON
          -DCOV_BUILD_TESTS=OFF
          -DCMAKE_CUDA_ARCHITECTURES="120-real;120-virtual"
      - name: Build cov.exe
        shell: pwsh
        run: cmake --build build-cuda --config Release --parallel
      - name: Verify Blackwell payload
        shell: pwsh
        run: |
          $exe = "build-cuda/Release/cov.exe"
          if (-not (Test-Path $exe)) { throw "cov.exe was not produced" }
          $cuobjdump = Join-Path $env:CUDA_PATH "bin/cuobjdump.exe"
          if (-not (Test-Path $cuobjdump)) { throw "cuobjdump.exe is missing" }
          & $cuobjdump --list-elf $exe | Tee-Object -FilePath build-cuda/cuobjdump.txt
          if (-not (Select-String -Path build-cuda/cuobjdump.txt -Pattern "sm_120" -Quiet)) { throw "sm_120 cubin missing" }
          & $cuobjdump --dump-ptx $exe | Tee-Object -FilePath build-cuda/ptx.txt
          if (-not (Select-String -Path build-cuda/ptx.txt -Pattern "\.target sm_120" -Quiet)) { throw "compute_120 PTX missing" }
      - name: Upload valence milestone viewer
        uses: actions/upload-artifact@v4
        with:
          name: cov-pr3-valence-windows-sm120
          path: build-cuda/Release/cov.exe
          if-no-files-found: error
          retention-days: 14
