name: core-ci

on:
  push:
  pull_request:

jobs:
  cpu-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU core build
        run: cmake -S . -B build -DCOV_ENABLE_CUDA=OFF -DCOV_BUILD_TESTS=ON
      - name: Build parser, orbital, diagram and UI smoke targets
        run: cmake --build build --config Release --parallel
      - name: Test parser, orbital semantics, exports and localisation
        run: ctest --test-dir build -C Release --output-on-failure
