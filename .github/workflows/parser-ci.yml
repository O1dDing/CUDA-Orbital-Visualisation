name: core-ci

on:
  push:
  pull_request:

jobs:
  cpu-core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure CPU core build
        run: cmake -S . -B build -DCOV_ENABLE_CUDA=OFF -DCOV_BUILD_TESTS=ON
      - name: Build parser, orbital chemistry, diagram and UI targets
        run: cmake --build build --config Release --parallel
      - name: Download pinned real Gaussian 16 FCHK regression
        run: >-
          python -c "import urllib.request; u='https://raw.githubusercontent.com/cclib/cclib/21daa960123d28aa21eeaaacc2a1dea39e136829/data/FChk/basicGaussian16/dvb_sp.fchk'; urllib.request.urlretrieve(u, r'build/real_gaussian16_dvb_sp.fchk')"
      - name: Run test suite
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload deterministic MO visual-regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mo-visual-${{ matrix.os }}
          path: build/visual_artifacts/
          if-no-files-found: warn

  windows-cuda-viewer:
    name: Windows CUDA viewer and prerelease
    needs: cpu-core
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install CUDA 12.8.2 build toolkit
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: '12.8.2'
          method: network
          sub-packages: '["nvcc", "cudart", "cuobjdump", "visual_studio_integration"]'
      - name: Configure Blackwell Release viewer
        shell: pwsh
        run: >-
          cmake -S . -B build-cuda
          -G "Visual Studio 17 2022" -A x64
          -DCOV_ENABLE_CUDA=ON
          -DCOV_BUILD_TESTS=OFF
          -DCMAKE_CUDA_ARCHITECTURES="120-real;120-virtual"
      - name: Build cov.exe
        shell: pwsh
        run: cmake --build build-cuda --config Release --parallel
      - name: Verify Blackwell payload
        shell: pwsh
        run: |
          $exe = "build-cuda/Release/cov.exe"
          if (-not (Test-Path $exe)) { throw "cov.exe was not produced" }
          $cuobjdump = Join-Path $env:CUDA_PATH "bin/cuobjdump.exe"
          if (-not (Test-Path $cuobjdump)) { throw "cuobjdump.exe is missing" }
          & $cuobjdump --list-elf $exe | Tee-Object -FilePath build-cuda/cuobjdump.txt
          if (-not (Select-String -Path build-cuda/cuobjdump.txt -Pattern "sm_120" -Quiet)) { throw "sm_120 cubin missing" }
          & $cuobjdump --dump-ptx $exe | Tee-Object -FilePath build-cuda/ptx.txt
          if (-not (Select-String -Path build-cuda/ptx.txt -Pattern "\.target sm_120" -Quiet)) { throw "compute_120 PTX missing" }
      - name: Stage v0.3.0-pre.8 executable
        shell: pwsh
        run: |
          $source = "build-cuda/Release/cov.exe"
          $asset = "build-cuda/Release/CUDA-Orbital-Visualisation-v0.3.0-pre.8-Windows-sm120.exe"
          Copy-Item $source $asset -Force
          Get-Item $asset | Format-List FullName,Length,LastWriteTime
      - name: Upload pre.8 executable
        uses: actions/upload-artifact@v4
        with:
          name: cov-v0.3.0-pre.8-windows-sm120
          path: build-cuda/Release/CUDA-Orbital-Visualisation-v0.3.0-pre.8-Windows-sm120.exe
          if-no-files-found: error
          retention-days: 30
      - name: Publish v0.3.0-pre.8
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/fchk-primary-interface'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.3.0-pre.8"
          $asset = "build-cuda/Release/CUDA-Orbital-Visualisation-v0.3.0-pre.8-Windows-sm120.exe"
          $title = "CUDA Orbital Visualisation v0.3.0-pre.8 — Chemical-Valence MO Milestone"
          $notes = @"
          This prerelease advances PR #3 with FCHK-driven chemical-valence orbital analysis.

          ### Highlights
          - Chemical-valence MO selection is derived from an element- and ECP-aware minimal atomic reference using the AO-overlap metric.
          - Auto and Valence views, together with the MO diagram, use the derived chemical-valence manifold instead of an energy cutoff.
          - Selected-MO details expose valence AO composition, sigma/pi/delta/phi character, bonding character, Mayer pair indices, method-labelled MO overlap contributions, and supported multicentre families.
          - Transition-metal `(n-1)d + ns + np` functions are retained as valence candidates, with `(n-1)s,(n-1)p` treated as semicore candidates.
          - Unsupported assignments remain percentage-valued or explicitly undetermined rather than being forced into a categorical label.
          - The CUDA/OpenGL viewer remains built with CUDA 12.8.2 and includes native `sm_120` code plus compute_120 PTX fallback.

          Producer NBO/Wiberg data, expanded Gaussian LOG/OUT chemistry parsing, WFX input, and cross-source reconciliation remain planned for a later prerelease.
          "@

          gh release view $tag --repo "$env:GITHUB_REPOSITORY" *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --repo "$env:GITHUB_REPOSITORY" --clobber
            gh release edit $tag --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          } else {
            gh release create $tag $asset --repo "$env:GITHUB_REPOSITORY" `
              --target "$env:GITHUB_SHA" --title $title --notes $notes --prerelease
          }
